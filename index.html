<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebScript Marketplace Embed</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: #222;
      color: #fff;
    }
    header a { color: #fff; text-decoration: none; font-weight: bold; }
    .buy-btn {
      background: #ff6f61;
      padding: 0.5rem 1rem;
      border-radius: 4px;
    }
    iframe {
      width: 100%;
      height: calc(100% - 56px); /* match your header height */
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <a href="https://webscriptmarketplace.com/" target="_blank">
      WebScript Marketplace
    </a>
    <a href="https://webscriptmarketplace.com/buy" class="buy-btn" target="_blank">
      Buy Now
    </a>
  </header>
  <iframe src="https://vovan.xyz" allowfullscreen></iframe>
</body>
</html>
